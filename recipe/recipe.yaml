schema_version: 1

context:
  name: uutils-coreutils
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/uutils/coreutils/archive/${{ version }}.tar.gz
    sha256: 4fb327655cb4ffcbf2f16550cf9234079ffe839692f7aa1a6eda104af684e122
  - git: https://github.com/uutils/coreutils-l10n.git
    target_directory: coreutils-l10n
    depth: 1

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
  prefix_detection:
    # Rust packs string literals without terminators, so rewriting the build
    # prefix embedded by stdbuf (LIBSTDBUF_DIR) shifts neighbouring utility
    # names and breaks e.g. `nl`. Nothing needs the path: stdbuf finds
    # libstdbuf next to the executable.
    ignore_binary_files: true

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: unix
      then: make
  ignore_run_exports:
    from_package:
      - if: win
        then:
          - ${{ stdlib('c') }}
          - ${{ compiler('c') }}
  run_constraints:
    - coreutils ==999999999
    - gnu-coreutils ==999999999
    - m2-coreutils ==999999999

tests:
  - script:
      - coreutils --help
      - cat --help
      - cp --version
      - mkdir --version
      - if: unix
        then:
          - nl --version
          - stdbuf -oL true
      # every utility in the multi-call binary must be callable by name
          - for utility in $(coreutils --list); do test -x "$PREFIX/bin/$utility" || exit 1; done
        else: for /f "usebackq delims=" %%U in (`coreutils --list`) do if not "%%U" == "link" if not exist "%PREFIX%\bin\%%U.exe" exit 1
  - package_contents:
      bin:
        - coreutils
        - cat
        - cp
        - mkdir

about:
  summary: Cross-platform Rust rewrite of the GNU coreutils
  description: |
    uutils is an attempt at writing universal (as in cross-platform) CLI utilities in Rust.
    uutils aims to work on as many platforms as possible,
    to be able to use the same utils on Linux, Mac, Windows and other platforms.
    This ensures, for example, that scripts can be easily transferred between platforms.
    Rust was chosen not only because it is fast and safe,
    but is also excellent for writing cross-platform code.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://uutils.github.io/coreutils/
  repository: https://github.com/uutils/coreutils
  documentation: https://uutils.github.io/coreutils/docs/

extra:
  recipe-maintainers:
    - XhstormR
    - sshockwave
